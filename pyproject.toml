[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataforge"
version = "0.1.0"
description = "Configuration-driven text and vision training data synthesis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=3.22.1,<4",
  "anthropic>=1.9.0,<2",
  "pydantic>=2.10.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.0",
  "typer>=0.15.0",
  "Pillow>=11.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.25.0", "ruff>=0.9.0", "httpx2>=2.13.1,<3"]

[project.scripts]
dataforge = "dataforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dataforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
